<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hari Mouse</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 60px;
    }
    button {
      font-size: 20px;
      padding: 15px 25px;
      margin-top: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🖱️ Hari Mouse</h1>
  <p>Turn your phone into a wireless mouse</p>

  <p><b>STEP 1:</b> Connect phone & laptop to same Wi-Fi</p>
  <p><b>STEP 2:</b> Run server on laptop</p>
  <p><b>STEP 3:</b> Click button below on PHONE</p>

  <button onclick="openLocal()">Connect to Laptop</button>

  <script>
    function openLocal() {
      alert(
        "Open this on your PHONE:\n\n" +
        "http://YOUR_LAPTOP_IP:4000\n\n" +
        "Example:\nhttp://192.168.0.43:4000"
      );
    }
  </script>

</body>
</html>
