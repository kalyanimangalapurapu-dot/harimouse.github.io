<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hari Mouse</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 40px;
    }
    img {
      width: 240px;
      margin-top: 20px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🖱️ Hari Mouse</h1>
  <p>Turn your phone into a mouse</p>

  <button onclick="showQR()">Start Phone as Mouse</button>

  <div id="qr"></div>

  <script>
    function showQR() {
      const phoneURL = location.origin + "/phone.html";
      const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
        encodeURIComponent(phoneURL);

      document.getElementById("qr").innerHTML =
        `<p>Scan with your phone</p><img src="${qrURL}" />`;
    }
  </script>

</body>
</html>
