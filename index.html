<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hari Mouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🖱️ Hari Mouse</h1>
    <p class="subtitle">Turn your phone into a wireless mouse</p>

    <div class="card">
      <h2>📱 How it works</h2>
      <ol>
        <li>Open Hari Mouse on your laptop</li>
        <li>Click <b>Get QR</b></li>
        <li>Scan QR using your phone</li>
        <li>Touch & move → cursor moves</li>
      </ol>
    </div>

    <div class="card">
      <h2>🚀 Start Now</h2>
      <p>Server already running on laptop</p>
      <p class="hint">Phone & Laptop must be on same Wi-Fi</p>

      <!-- ONLY GET QR SHOULD OPEN QR -->
      <button class="secondary" onclick="getQR()">Get QR</button>

      <div id="qrBox"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
